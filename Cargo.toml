[workspace]
resolver = "2"
members = [
  "crates/atlas-analyzers",
  "crates/atlas-engine",
  "crates/atlas-llm",
  "crates/atlas-agents",
  "crates/atlas-reports",
  "crates/atlas-cli",
  "crates/component-ontology",
  "crates/atlas-index",
  "crates/analyzers/python",
  "crates/analyzers/csharp",
  "crates/analyzers/dart",
  "crates/analyzers/elixir",
  "crates/analyzers/racket",
  "crates/analyzers/lispkit",
  "evaluation/harness",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/linkuistics/Atlas"
version = "1.3.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
indicatif = "0.17"
petgraph = "0.6"
ratatui = "0.28"
rayon = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rmcp = "1.6"
salsa = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "process", "io-util", "time", "fs"] }
toml = "1"
tracing = "0.1"

# Public data-format / vocabulary crates, in-tree as workspace members
# (folded from atlas-contracts in Phase 5). Independent versioning at
# 0.1.0; per-crate release.toml overrides keep them out of workspace-
# wide `cargo release` invocations. Both publish to crates.io.
component-ontology = { path = "crates/component-ontology" }
atlas-index = { path = "crates/atlas-index" }

# Test-only deps shared by multiple crates.
assert_cmd = "2"
predicates = "3"
proptest = "1"
regex = "1"
tempfile = "3"

[workspace.lints.rust]
warnings = "deny"
