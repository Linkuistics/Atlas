[package]
name = "atlas-cli"
version.workspace = true
description = "Atlas CLI binary; command parsing, configuration, atomic file writes, driver for atlas-engine."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "atlas_cli"
path = "src/lib.rs"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
atlas-analyzers = { path = "../atlas-analyzers" }
atlas-engine = { path = "../atlas-engine" }
atlas-index = { workspace = true }
atlas-llm = { path = "../atlas-llm" }
atlas-reports = { path = "../atlas-reports" }
chrono = { workspace = true }
clap = { workspace = true }
component-ontology = { workspace = true }
salsa = { workspace = true }
indicatif = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
async-trait = { workspace = true }
# `test-fixtures` pulls in `atlas_engine::testing::LenientBackend` for our
# integration tests. See `crates/atlas-engine/Cargo.toml` for the canonical
# explanation of the feature gate.
atlas-engine = { path = "../atlas-engine", features = ["atomic_write_panic_after_temp", "test-fixtures"] }
atlas-llm = { path = "../atlas-llm" }
atlas-reports = { path = "../atlas-reports" }
chrono = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
