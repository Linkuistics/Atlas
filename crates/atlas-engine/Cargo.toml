[package]
name = "atlas-engine"
version.workspace = true
description = "Salsa-backed query graph that drives Atlas's component-discovery fixedpoint."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
atlas-analyzers = { path = "../atlas-analyzers" }
atlas-index = { workspace = true }
atlas-llm = { path = "../atlas-llm" }
component-ontology = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
petgraph = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
salsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
atlas-csharp-analyzer = { path = "../analyzers/csharp" }
proptest = { workspace = true }

[features]
# Test-only hook: arms a one-shot panic between `atomic_write`'s
# temp-file write and the rename, so cross-crate integration tests can
# simulate a kill mid-write. Disabled by default; enabled by tests
# (e.g. `atlas-cli`'s `atlas_drift_kill_during_snapshot_write...`)
# that need to exercise the atomic-write contract end-to-end. See
# Phase 3 plan §4 PR-8 acceptance criteria + design §6.3.
atomic_write_panic_after_temp = []

[lints]
workspace = true
