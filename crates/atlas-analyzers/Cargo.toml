[package]
name = "atlas-analyzers"
version.workspace = true
description = "Analyser registry and reference analysers (Cargo, Dockerfile, LLM-classify) for Atlas vNext."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
atlas-index = { workspace = true }
atlas-llm = { path = "../atlas-llm" }
component-ontology = { workspace = true }
globset = { workspace = true }
# `span-locations` enables `proc_macro2::Span::byte_range` outside the
# proc-macro context (i.e. when we parse files via `syn::parse_file`).
# Pinned alongside `syn` so PR-5's Rust surface analyser produces
# byte-range spans consumable by `code_derived_content_sha`.
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
thiserror = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
