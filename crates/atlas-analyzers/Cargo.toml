[package]
name = "atlas-analyzers"
version.workspace = true
description = "Analyser registry and reference analysers (Cargo, Dockerfile, LLM-classify) for Atlas vNext."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
atlas-index = { workspace = true }
libc = "0.2"
atlas-llm = { path = "../atlas-llm" }
base64 = { workspace = true }
component-ontology = { workspace = true }
globset = { workspace = true }
# `span-locations` enables `proc_macro2::Span::byte_range` outside the
# proc-macro context (i.e. when we parse files via `syn::parse_file`).
# Pinned alongside `syn` so PR-5's Rust surface analyser produces
# byte-range spans consumable by `code_derived_content_sha`.
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
syn = { version = "2.0.117", features = ["full"] }
# swc_ecma_parser pulls in swc_ecma_ast / swc_common transitively. Used
# by ts_js_surface_analyzer for in-process TypeScript / JavaScript parsing
# (Phase 2 PR-1). Pinned at the major version available on crates.io
# at the time of PR-1; bumps require parser-shape verification because
# swc's AST evolves between major versions.
swc_common = "21"
swc_ecma_ast = "23"
swc_ecma_parser = "39"
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Reference echo binary — exercised by the subprocess transport
# integration tests (PR-2). The fixture lives under
# `tests/fixtures/echo_subprocess/main.rs` and is shipped only as a
# test artefact; production code never spawns it. Cargo writes the
# binary to the same `target/<profile>` directory as the crate's
# tests, and tests look it up via `env!("CARGO_BIN_EXE_echo_subprocess")`.
[[bin]]
name = "echo_subprocess"
path = "tests/fixtures/echo_subprocess/main.rs"
test = false
doc = false

[lints]
workspace = true
